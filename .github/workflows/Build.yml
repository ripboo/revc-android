name: Build reVC Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # تم إضافة خيارات إهمال التحذيرات وإناء النسختين (Debug & Release)
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug assembleRelease -Pandroid.experimental.disableCompileSdkChecks=true --stacktrace -x test

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reVC-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
