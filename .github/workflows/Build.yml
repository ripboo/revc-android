name: Build reVC Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 1. تنفيذ البناء وحفظ السجل المباشر في ملف مؤقت بدون إيقاف السيرفر فوراً
      - name: Build Release APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace > build.log 2>&1

      # 2. خطوة مستقلة تُعرض فقط في حال الفشل، وعند الضغط عليها تطبع الأخطاء المباشرة فقط
      - name: Show Only Failure Reasons (Errors)
        if: steps.build.outcome == 'failure'
        run: |
          echo "=================================================================="
          echo "                      DIRECT BUILD ERRORS ONLY                    "
          echo "=================================================================="
          
          # استخراج سطور الأخطاء واستبعاد التحذيرات (warnings)
          grep -i -E "error:|failed|exception|cause:|fatal" build.log | grep -v -i "warning" || cat build.log | tail -n 50
          
          echo "=================================================================="
          # إيقاف المهمة رسمياً ليعلم GitHub أن البناء قد فشل
          exit 1

      - name: Upload APK Artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reVC-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
