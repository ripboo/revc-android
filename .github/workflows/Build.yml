name: Build reVC Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود مع المجلدات الفرعية (Submodules)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. إعداد بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد أدوات Android SDK و NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      # 4. إعطاء صلاحية التشغيل لملف gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. بناء التطبيق (Release APK)
      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      # 6. رفع ملف الـ APK النهائي لتتمكن من تحميلة
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: reVC-Release-APK
          path: app/build/outputs/apk/release/*.apk
